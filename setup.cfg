[metadata]
name = uqef_dynamic
version = 0.1
url=https://github.com/ivanajovanovic/UQEF-Dynamic
author = Ivana Jovanovic Buha
author_email = ivana.jovanovic@tum.de
description = Framework for Efficient Uncertainty Qunatification and Sensitivty Analysis of Time-varying Model Outputs 
description-file = README.md
long_description = file: README.rst, CHANGELOG.rst, LICENSE.rst
keywords = uncertainty qunatification, sensitivty analysis,  time-varying, time-dependent model outputs
license = GNU
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Mathematics
    License :: OSI Approved :: GNU GPL-3.0 License
    Natural Language :: English
    Programming Language :: Python :: 3

[options]
include_package_data = True
packages = find:
python_requires = >=3.6
install_requires =
    chaospy
    uqef
    dill
    joblib
    matplotlib
    more_itertools
    mpi4py
    numpy
    pandas
    plotly
    pyproj
    scikit-learn
    scipy
    seaborn
    setuptools
zip_safe = False

[options.packages.find]
exclude =
    common*
    data*
    docs*
    misc*
    Notebooks*
    simulations*
    tests*

[aliases]
test=pytest

[tool:pytest]
testpaths = tests
addopts = --doctest-modules --doctest-glob='*.rst' --cov=uqef_dynamic --cov-report term-missing
